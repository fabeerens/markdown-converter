services:
  markdown-converter:
    build: .
    container_name: markdown-converter
    restart: unless-stopped
    ports:
      - "127.0.0.1:3007:5001"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL}
      - OCR_MODEL=${OCR_MODEL}
      - OCR_DPI=${OCR_DPI}
      - PISTE_JUDILIBRE_KEY=${PISTE_JUDILIBRE_KEY}
      - PISTE_JUDILIBRE_SECRET=${PISTE_JUDILIBRE_SECRET}
      - PISTE_JUDILIBRE_PROD_KEY=${PISTE_JUDILIBRE_PROD_KEY}
      - PISTE_JUDILIBRE_PROD_SECRET=${PISTE_JUDILIBRE_PROD_SECRET}
    volumes:
      - ./.deploy-state:/app/.deploy-state